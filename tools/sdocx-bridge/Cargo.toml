[package]
name = "sdocx-bridge"
version = "0.1.0"
edition = "2021"
description = "Thin wrapper around the sdocx crate: parse Samsung Notes .sdocx into the OpenNotes import model"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "sdocx-dump"
path = "src/main.rs"

[dependencies]
sdocx = { version = "1.1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = "s"
lto = true
strip = true
